# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# rust-clippy is a tool that runs a bunch of lints to catch common
# mistakes in your Rust code and help improve your Rust code.
# More details at https://github.com/rust-lang/rust-clippy
# and https://rust-lang.github.io/rust-clippy/

name: rust-clippy analyze

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '33 16 * * 2'

jobs:
  rust-clippy-analyze:
    name: Run rust-clippy analyzing
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # actions-rs/toolchain is archived and still runs on node12; dtolnay/rust-toolchain is a
      # composite action (no node runtime at all) and is what release.yml already uses.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install required cargo
        run: cargo install clippy-sarif sarif-fmt

      # Clippy has to compile the crate, so it needs the same GTK/WebKit headers
      # `rust.yml` installs before `cargo build`.
      - name: Install system dependencies for Tauri (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # `working-directory`, not `--manifest-path`: cargo discovers `.cargo/config.toml`
      # upward from the current directory, so from the repo root `src-tauri/.cargo/config.toml`
      # would be silently ignored. `--all-targets` matches `npm run lint:rust`, the zero-warning
      # gate; the crate declares no features, so `--all-features` was a no-op.
      - name: Run rust-clippy
        working-directory: src-tauri
        run:
          cargo clippy
          --all-targets
          --message-format=json | clippy-sarif | tee rust-clippy-results.sarif | sarif-fmt
        continue-on-error: true

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: src-tauri/rust-clippy-results.sarif
          wait-for-processing: true
