name: Build & Release TableGrid

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            name: 'macOS Apple Silicon (M1/M2/M3/M4)'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            name: 'Windows x64'

    runs-on: ${{ matrix.platform }}
    name: Build ${{ matrix.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'TableGrid v__VERSION__'
          releaseBody: |
            Official release build of TableGrid for macOS (Apple Silicon ARM64) and Windows (x64).

            ⚠️ **macOS Installation Note ("TableGrid is damaged and can't be opened")**:
            Since this build is currently unsigned with an Apple Developer ID, macOS Gatekeeper may block downloaded `.dmg` packages with a security prompt.

            To open the application on macOS, move `TableGrid.app` to your **Applications** folder, open **Terminal**, and execute:
            ```bash
            sudo xattr -rd com.apple.quarantine /Applications/TableGrid.app
            ```
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
