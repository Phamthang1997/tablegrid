[package]
name = "tablegrid"
version = "0.1.1"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
# Process-wide allocator, wired up in main.rs — see the comment there for what it is expected to buy
# and how to tell whether it did. Builds mimalloc from C via `cc`, so it costs one C toolchain
# dependency and some first-build time; nothing at runtime beyond the allocator itself.
mimalloc = "0.1.52"
tauri = { version = "2.11.5", features = ["macos-private-api"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
window-vibrancy = "0.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "mysql",
] }
# Bật feature kiểu dữ liệu trực tiếp trên driver Postgres/MySQL để KHÔNG kéo theo sqlx-sqlite
# (sqlx-sqlite xung đột libsqlite3-sys với rusqlite). Nhờ đó decode được date/numeric/json/uuid.
sqlx-postgres = { version = "0.9.0", default-features = false, features = [
    "chrono",
    "bigdecimal",
    "uuid",
    "json",
] }
sqlx-mysql = { version = "0.9.0", default-features = false, features = [
    "chrono",
    "bigdecimal",
    "uuid",
    "json",
] }
bigdecimal = "0.4"
# `v4` cho `Uuid::new_v4()`: conn_id do backend sinh (multi-connection-plan §4.3 — opaque, không
# dẫn xuất từ config vì config mang secret). sqlx chỉ cần uuid để decode nên không bật feature này.
uuid = { version = "1", features = ["v4"] }
russh = "0.63.0"
portable-pty = "0.9"
zip = "8.6.0"
tokio = { version = "1.53.1", features = ["full"] }
futures-util = "0.3"
thiserror = "2.0.20"
chrono = "0.4.45"
regex = "1.13.1"
hmac = "0.13"
sha2 = "0.11"
# `tls-rustls-insecure` is what makes the REQUIRED and VERIFY_CA modes of the Redis SSL tab
# possible: without it redis-rs refuses both `#insecure` and `danger_accept_invalid_hostnames`
# at connect time. VERIFY_CA is also the only usable mode when Redis is reached over an SSH
# tunnel, because the certificate is then presented for 127.0.0.1.
redis = { version = "1.5.0", features = [
    "tokio-comp",
    "tokio-rustls-comp",
    "tls-rustls-insecure",
] }
# Payload DUMP của Redis là byte thô. Xuất/nhập keyspace ghi nó vào tệp NDJSON, nên cần base64:
# mảng số như `redis_get_key` dùng cho `bytes` thì gấp ~3 lần kích thước và không ghi được ra tệp
# text. Bản 0.22 đã có trong Cargo.lock từ trước (dependency gián tiếp) nên không thêm gì mới vào
# cây phụ thuộc.
base64 = "0.23.1"
# Nhật ký MCP ghi ra tệp được mã hoá (`mcp/audit_file.rs`): mục ghi mang nguyên văn câu SQL, mà SQL
# mang dữ liệu — một INSERT gọi tên giá trị, một WHERE gọi tên con người. Để plaintext trên đĩa là
# biến vết kiểm toán thành bản sao thứ hai của dữ liệu, đọc được bởi mọi trình sao lưu / đồng bộ /
# lập chỉ mục trên máy. Chọn aes-gcm vì nó ĐÃ có sẵn trong Cargo.lock (qua `pkcs5`), nên khai báo
# trực tiếp không kéo thêm crate nào vào cây — cùng lý lẽ với `base64` ở trên.
aes-gcm = "0.11"
# Kho bí mật của HĐH (Windows Credential Manager / Keychain / Secret Service).
# Tắt default-features rồi bật đúng backend theo từng nền tảng bên dưới, tránh kéo
# zbus + secret-service vào bản build Windows.
keyring = { version = "4.1.6", default-features = false, features = ["v1"] }

# Built-in MCP server (docs/mcp-server-plan.md). `rmcp` is the official SDK and owns the protocol:
# JSON-RPC 2.0, `initialize`, version negotiation and Streamable HTTP sessions. That part is
# deliberately not hand-written - the spec revision moved twice while this plan was being written,
# and version negotiation is the piece that fails silently once it is out of date.
#
# ONLY the server transport is enabled. Every `reqwest*` feature is client-side and would pull in a
# SECOND TLS stack alongside the rustls that sqlx and redis already use.
rmcp = { version = "3.1", features = ["transport-streamable-http-server"] }
# rmcp hands back a tower::Service and ships no bind/listen helper, so an HTTP host is still needed.
# axum does exactly that, plus the two security middlewares (Origin/Host, bearer token). The protocol
# does not live there.
axum = "0.8.9"
# CancellationToken: the shutdown path, shared with StreamableHttpServerConfig.
tokio-util = "0.7.19"
# Only for `--mcp-stdio` (mcp/stdio.rs): one loopback POST per line of stdin. Already in Cargo.lock
# as a transitive dep, so declaring it pulls no new crate into the tree; no TLS features, because the
# only host it ever talks to is 127.0.0.1.
reqwest = { version = "0.13", default-features = false }

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "4.1.6", features = ["windows-native-keyring-store"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4.1.6", features = ["apple-native-keyring-store"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "4.1.6", features = [
    "zbus-secret-service-keyring-store",
] }

# Dev runs the real app against real databases, so it should not run it at a tenth of its speed.
# Plain `[profile.dev]` is `opt-level = 0`, and measurement showed what that costs: decoding 79,040
# rows into JSON took 3.5s of a 6.8s run, ~45us per row, for work that is a few string moves.
#
# The split matters. `opt-level = 3` on DEPENDENCIES is where the win is — serde_json, sqlx and
# rusqlite do the per-row work — and they are compiled once and then cached forever, so their
# optimization is free after the first build. Our own crate stays at 1: enough to remove the worst
# of the debug-mode overhead, cheap enough that editing a command still recompiles in seconds.
#
# Deliberately no `lto` and no `codegen-units` here: those two are what make the release build take
# 17 minutes, and fat LTO is also what inflates the `generate_handler!` dispatch into a stack frame
# big enough to overflow at startup (see src-tauri/.cargo/config.toml). Dev wants neither.
#
# Cost of adding this: one full rebuild of every dependency, once. After that, iteration is faster
# than before AND the app is several times quicker at anything data-heavy.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Release-only tuning: `tauri build` (the installable app) uses this profile, while
# `tauri dev` uses [profile.dev] and writes to a different target dir, so a running
# dev session is unaffected. Cost is a full recompile on the first build afterwards.
#
# `panic` and `overflow-checks` are deliberately left at their defaults: `panic = "abort"`
# would turn a panic inside a single command into a crash of the whole app (losing the
# open connection and every unsaved SQL draft), and release already implies
# `overflow-checks = false`, so spelling it out changes nothing.
[profile.release]
lto = "fat"       # whole-program LTO; pairs with codegen-units = 1
codegen-units = 1 # one unit lets LLVM optimize across the whole crate graph
strip = true      # drop symbol names (release carries no debuginfo already)
